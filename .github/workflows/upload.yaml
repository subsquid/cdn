name: Upload
on:
  push:
    branches:
      - main
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: cancel previous runs
        uses: styfle/cancel-workflow-action@0.5.0
        with:
          access_token: ${{ github.token }}

      - id: auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'

      - name: set up cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          version: '>= 363.0.0'
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: upload
        run: |-
          gsutil rsync -r -x '^points/testnet-rewards/current\.json$' src gs://subsquid-public

      # The claim frontend reads this file straight from GCS, so it must not be
      # cached. Uploaded separately so it never exists with the default max-age=3600.
      - name: upload testnet rewards
        run: |-
          f=src/points/testnet-rewards/current.json
          if [ -f "$f" ]; then
            gsutil -h "Cache-Control:no-cache" cp "$f" gs://subsquid-public/points/testnet-rewards/current.json
          fi

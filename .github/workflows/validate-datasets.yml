name: Validate datasets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  retired-datasets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save js-yaml
      - run: node --test tests/*.test.js
